<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GPS Route — 3 Designs</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; font-family: 'JetBrains Mono', monospace; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

// ─── Shared data ─────────────────────────────────────────────────────────────
// Map-aligned scene coordinates (same map as v3, scale-agnostic in source).
const SCENES = [
  { id:'mkt',   name:'Market',          short:'Market',    x:418, y:115 },
  { id:'kak',   name:'Kakariko',        short:'Kakariko',  x:680, y:105 },
  { id:'zor',   name:'Zora River',      short:'Zora R.',   x:750, y:205 },
  { id:'tek',   name:'Tektite Grotto',  short:'Tektite',   x:240, y:178 },
  { id:'gerv',  name:'Gerudo Valley',   short:'Gerudo V.', x:82,  y:280 },
  { id:'ranch', name:"Lon Lon Ranch",   short:'Lon Lon',   x:440, y:280 },
  { id:'hf',    name:'Hyrule Field',    short:'Hyr. Field',x:400, y:380 },
  { id:'lost',  name:'Lost Woods',      short:'Lost W.',   x:728, y:362 },
  { id:'open',  name:'Open Grotto',     short:'Open Gr.',  x:400, y:487 },
  { id:'lake',  name:'Lake Hylia',      short:'Lake Hylia',x:370, y:557 },
];
const SC = Object.fromEntries(SCENES.map(s => [s.id, s]));

// Sample routes for "Kakariko → Lake Hylia"
// Steps include the transition kind: "walk", "owl", "warp", "song"
const ROUTES = [
  {
    id:'r1', label:'Rapide',     time:'1:25', steps:3, transitions:2, hue:140,
    notes:'2 transitions · trajet direct',
    path: [
      { sc:'kak',   via:'walk' },
      { sc:'hf',    via:'walk' },
      { sc:'lake',  via:'walk' },
    ],
  },
  {
    id:'r2', label:'Équilibrée', time:'2:10', steps:4, transitions:3, hue:42,
    notes:'1 owl warp · contourne Hyrule Field',
    path: [
      { sc:'kak',   via:'walk' },
      { sc:'mkt',   via:'walk' },
      { sc:'tek',   via:'owl'  },
      { sc:'lake',  via:'walk' },
    ],
  },
  {
    id:'r3', label:'Détour',     time:'3:50', steps:5, transitions:4, hue:0,
    notes:'collecte possible · 1 grotto',
    path: [
      { sc:'kak',   via:'walk' },
      { sc:'zor',   via:'walk' },
      { sc:'hf',    via:'walk' },
      { sc:'open',  via:'song' },
      { sc:'lake',  via:'walk' },
    ],
  },
];

const VIA_LABEL = { walk:'Walk', owl:'Owl', warp:'Warp', song:'Song' };
const VIA_GLYPH = { walk:'→', owl:'⌃', warp:'✦', song:'♪' };

// ─── Tiny shared atoms ───────────────────────────────────────────────────────
const Pill = ({ color, children, dim }) => (
  <span style={{
    display:'inline-flex', alignItems:'center', gap:4,
    padding:'1px 6px', borderRadius:3, fontSize:9,
    color: dim ? 'rgba(255,255,255,0.4)' : color,
    border:`1px solid ${dim ? 'rgba(255,255,255,0.08)' : color+'55'}`,
    background: dim ? 'transparent' : color+'14',
    letterSpacing:0.5,
  }}>{children}</span>
);

const SceneInput = ({ label, value, accent }) => (
  <div style={{
    display:'flex', alignItems:'center', gap:8,
    padding:'8px 10px', background:'rgba(255,255,255,0.04)',
    border:'1px solid rgba(255,255,255,0.08)', borderRadius:4,
    borderLeft:`3px solid ${accent}`,
  }}>
    <span style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>{label}</span>
    <span style={{fontSize:12, color:'#fff', fontWeight:500, flex:1}}>{value}</span>
    <span style={{fontSize:9, color:'rgba(255,255,255,0.35)'}}>▾</span>
  </div>
);

// ═════════════════════════════════════════════════════════════════════════════
// DESIGN 1 — "Directions" sidebar (Google Maps-like)
// ═════════════════════════════════════════════════════════════════════════════
function Design1() {
  const AW=1180, AH=620;
  const PW=340;
  const S=0.55, W=1000*S, H=597*S;
  const MW=AW-PW;
  const ox=(MW-W)/2, oy=(AH-H)/2;

  const [sel, setSel] = React.useState('r1');
  const route = ROUTES.find(r=>r.id===sel);

  // Map route scene-coords to map-px
  const ptOf = id => ({ x: SC[id].x*S+ox, y: SC[id].y*S+oy });

  return (
    <div style={{width:AW,height:AH,display:'flex',background:'#0a0a14',color:'#fff',overflow:'hidden'}}>
      {/* ── Map side ────────────────────────────────────────────────────── */}
      <div style={{flex:1, position:'relative', background:'#06060e'}}>
        <img src="map_hyrule.png" draggable={false}
          style={{position:'absolute', left:ox, top:oy, width:W, height:H,
            userSelect:'none', filter:'brightness(0.65) saturate(0.9)'}}/>

        {/* All scenes (dim) */}
        <svg style={{position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none'}}>
          {SCENES.map(s => {
            const p = ptOf(s.id);
            return <circle key={s.id} cx={p.x} cy={p.y} r={3}
              fill="rgba(255,255,255,0.25)" stroke="rgba(0,0,0,0.5)" strokeWidth={0.8}/>;
          })}

          {/* Selected route line */}
          {route.path.map((step, i) => {
            if (i===0) return null;
            const a = ptOf(route.path[i-1].sc);
            const b = ptOf(step.sc);
            const mx = (a.x+b.x)/2, my=(a.y+b.y)/2 - 18;
            const c=`oklch(0.75 0.16 ${route.hue})`;
            return (
              <g key={i}>
                <path d={`M ${a.x} ${a.y} Q ${mx} ${my}, ${b.x} ${b.y}`}
                  fill="none" stroke={c} strokeWidth={2.2}
                  strokeLinecap="round" strokeDasharray={step.via==='owl'?'4,3':'none'}/>
              </g>
            );
          })}

          {/* Route scene markers */}
          {route.path.map((step, i) => {
            const p = ptOf(step.sc);
            const isStart = i===0, isEnd = i===route.path.length-1;
            const c = `oklch(0.75 0.16 ${route.hue})`;
            return (
              <g key={'m'+i}>
                <circle cx={p.x} cy={p.y} r={isStart||isEnd?7:5}
                  fill={isStart?'#3ddc84':isEnd?'#ff5252':'#0a0a14'}
                  stroke={isStart||isEnd?'#fff':c} strokeWidth={1.5}/>
                {(isStart||isEnd) && (
                  <text x={p.x} y={p.y+3} fontSize={8} textAnchor="middle"
                    fontFamily="monospace" fontWeight={700} fill="#000">
                    {isStart?'A':'B'}
                  </text>
                )}
              </g>
            );
          })}
        </svg>

        {/* Scene name labels along route */}
        {route.path.map((step, i) => {
          const p = ptOf(step.sc);
          return (
            <div key={'l'+i} style={{
              position:'absolute', left:p.x+10, top:p.y-7,
              fontSize:9, color:'#fff', textShadow:'0 0 4px #000, 0 0 4px #000',
              whiteSpace:'nowrap', pointerEvents:'none',
            }}>{SC[step.sc].name}</div>
          );
        })}

        {/* Map overlay: route stats */}
        <div style={{position:'absolute', top:12, right:12,
          background:'rgba(0,0,0,0.75)', border:'1px solid rgba(255,255,255,0.1)',
          borderRadius:4, padding:'8px 12px', display:'flex', gap:14, alignItems:'center'}}>
          <div style={{borderLeft:`3px solid oklch(0.75 0.16 ${route.hue})`, paddingLeft:8}}>
            <div style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>ROUTE</div>
            <div style={{fontSize:13, fontWeight:600}}>{route.label}</div>
          </div>
          <div style={{borderLeft:'1px solid rgba(255,255,255,0.1)', paddingLeft:14, display:'flex', gap:14}}>
            <div>
              <div style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>TEMPS</div>
              <div style={{fontSize:13, fontWeight:600, color:'#fff'}}>{route.time}</div>
            </div>
            <div>
              <div style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>ÉTAPES</div>
              <div style={{fontSize:13, fontWeight:600}}>{route.steps}</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── Sidebar ─────────────────────────────────────────────────────── */}
      <div style={{width:PW, borderLeft:'1px solid rgba(255,255,255,0.07)',
        background:'rgba(0,0,0,0.5)', display:'flex', flexDirection:'column'}}>

        {/* Header */}
        <div style={{padding:'12px 14px 10px', borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
          <div style={{fontSize:9, color:'rgba(255,255,255,0.4)', letterSpacing:1.5, marginBottom:8}}>
            ◆ ITINÉRAIRE
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:6, position:'relative'}}>
            <SceneInput label="DE" value="Kakariko" accent="#3ddc84"/>
            <SceneInput label="À"  value="Lake Hylia" accent="#ff5252"/>
            <div style={{position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
              width:24, height:24, borderRadius:12, background:'#0a0a14',
              border:'1px solid rgba(255,255,255,0.15)',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:11, color:'rgba(255,255,255,0.6)', cursor:'pointer'}}>⇅</div>
          </div>
        </div>

        {/* Route list */}
        <div style={{padding:'8px 0', flex:1, overflowY:'auto'}}>
          <div style={{padding:'6px 14px 4px', fontSize:8, color:'rgba(255,255,255,0.35)', letterSpacing:1.5}}>
            {ROUTES.length} ROUTES · TRIÉES PAR TEMPS
          </div>
          {ROUTES.map(r => {
            const active = r.id===sel;
            const c = `oklch(0.75 0.16 ${r.hue})`;
            return (
              <div key={r.id} onClick={()=>setSel(r.id)}
                style={{padding:'10px 14px', cursor:'pointer',
                  background:active?'rgba(255,255,255,0.05)':'transparent',
                  borderLeft:`3px solid ${active?c:'transparent'}`,
                  transition:'background 0.1s'}}>
                <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:4}}>
                  <span style={{fontSize:14, fontWeight:700, color:active?'#fff':'rgba(255,255,255,0.7)'}}>
                    {r.time}
                  </span>
                  <span style={{fontSize:10, color:c, fontWeight:500}}>{r.label}</span>
                  <span style={{marginLeft:'auto', fontSize:9, color:'rgba(255,255,255,0.4)'}}>
                    {r.steps} étapes
                  </span>
                </div>
                <div style={{fontSize:9, color:'rgba(255,255,255,0.45)', marginBottom:6}}>{r.notes}</div>

                {/* Mini path */}
                <div style={{display:'flex', alignItems:'center', gap:3, flexWrap:'wrap'}}>
                  {r.path.map((step, i) => (
                    <React.Fragment key={i}>
                      <span style={{
                        fontSize:9, color:active?'#fff':'rgba(255,255,255,0.55)',
                        background:'rgba(255,255,255,0.04)', padding:'2px 5px', borderRadius:2,
                      }}>{SC[step.sc].short}</span>
                      {i<r.path.length-1 && (
                        <span style={{fontSize:9, color:c, opacity:0.8}}>
                          {VIA_GLYPH[r.path[i+1].via]}
                        </span>
                      )}
                    </React.Fragment>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{padding:'10px 14px', borderTop:'1px solid rgba(255,255,255,0.07)',
          display:'flex', gap:6}}>
          <button style={{flex:1, padding:'6px 0', fontSize:10, fontFamily:'inherit',
            background:'rgba(61,220,132,0.12)', color:'#3ddc84',
            border:'1px solid rgba(61,220,132,0.3)', borderRadius:3,
            letterSpacing:0.5, cursor:'pointer'}}>DÉMARRER</button>
          <button style={{padding:'6px 12px', fontSize:10, fontFamily:'inherit',
            background:'transparent', color:'rgba(255,255,255,0.5)',
            border:'1px solid rgba(255,255,255,0.1)', borderRadius:3, cursor:'pointer'}}>⎘</button>
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// DESIGN 2 — Transit diagram (comparaison côte à côte)
// ═════════════════════════════════════════════════════════════════════════════
function Design2() {
  const AW=1180, AH=620;

  return (
    <div style={{width:AW, height:AH, background:'#0a0a14', color:'#fff',
      overflow:'hidden', display:'flex', flexDirection:'column', padding:14, gap:12}}>

      {/* ── Top bar : From/To + meta ─────────────────────────────────── */}
      <div style={{display:'flex', gap:10, alignItems:'center', flexShrink:0}}>
        <div style={{fontSize:9, color:'rgba(255,255,255,0.35)', letterSpacing:1.5, marginRight:4}}>
          GPS ◆ ROUTE
        </div>
        <div style={{display:'flex', alignItems:'center', gap:6,
          background:'rgba(255,255,255,0.04)', borderRadius:3,
          border:'1px solid rgba(255,255,255,0.08)', padding:'5px 10px'}}>
          <span style={{width:6, height:6, borderRadius:3, background:'#3ddc84'}}/>
          <span style={{fontSize:11, fontWeight:500}}>Kakariko</span>
          <span style={{fontSize:9, color:'rgba(255,255,255,0.3)'}}>▾</span>
        </div>
        <span style={{fontSize:11, color:'rgba(255,255,255,0.3)'}}>──────</span>
        <div style={{display:'flex', alignItems:'center', gap:6,
          background:'rgba(255,255,255,0.04)', borderRadius:3,
          border:'1px solid rgba(255,255,255,0.08)', padding:'5px 10px'}}>
          <span style={{width:6, height:6, borderRadius:3, background:'#ff5252'}}/>
          <span style={{fontSize:11, fontWeight:500}}>Lake Hylia</span>
          <span style={{fontSize:9, color:'rgba(255,255,255,0.3)'}}>▾</span>
        </div>
        <button style={{padding:'5px 8px', fontSize:10, fontFamily:'inherit',
          background:'transparent', color:'rgba(255,255,255,0.5)',
          border:'1px solid rgba(255,255,255,0.12)', borderRadius:3, cursor:'pointer'}}>⇅ Inverser</button>

        <div style={{marginLeft:'auto', display:'flex', gap:14, fontSize:10, color:'rgba(255,255,255,0.45)'}}>
          <span><span style={{color:'#3ddc84'}}>●</span> {ROUTES.length} routes trouvées</span>
          <span>Tri : <span style={{color:'#fff'}}>temps ▾</span></span>
          <span>Filtre : <span style={{color:'#fff'}}>tout</span></span>
        </div>
      </div>

      {/* ── Routes en colonnes ───────────────────────────────────────── */}
      <div style={{flex:1, display:'grid', gridTemplateColumns:'1fr 1fr 1fr',
        gap:10, overflow:'hidden'}}>
        {ROUTES.map((r, ri) => {
          const c = `oklch(0.75 0.16 ${r.hue})`;
          const isBest = ri===0;
          return (
            <div key={r.id} style={{
              background:'rgba(255,255,255,0.025)',
              border:`1px solid ${isBest?c+'55':'rgba(255,255,255,0.08)'}`,
              borderRadius:4, padding:'14px 14px 10px',
              display:'flex', flexDirection:'column',
              boxShadow: isBest ? `0 0 0 1px ${c}22, 0 8px 28px ${c}10` : 'none',
            }}>
              {/* Header */}
              <div style={{display:'flex', alignItems:'flex-start', gap:8, marginBottom:14}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:3}}>
                    <span style={{fontSize:9, color:c, letterSpacing:1.5, fontWeight:600}}>
                      ROUTE {ri+1}
                    </span>
                    {isBest && <Pill color={c}>★ MEILLEURE</Pill>}
                  </div>
                  <div style={{fontSize:22, fontWeight:700, color:'#fff', lineHeight:1}}>
                    {r.time}
                    <span style={{fontSize:10, color:'rgba(255,255,255,0.4)', marginLeft:6, fontWeight:400}}>
                      {r.label.toLowerCase()}
                    </span>
                  </div>
                  <div style={{fontSize:9, color:'rgba(255,255,255,0.4)', marginTop:4}}>{r.notes}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:16, fontWeight:700, color:c}}>{r.transitions}</div>
                  <div style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>TRANSITIONS</div>
                </div>
              </div>

              {/* Transit diagram */}
              <div style={{flex:1, position:'relative', paddingLeft:14}}>
                {/* Vertical line */}
                <div style={{position:'absolute', left:6, top:6, bottom:14, width:2,
                  background:`linear-gradient(180deg, ${c} 0%, ${c}66 100%)`}}/>

                {r.path.map((step, i) => {
                  const isStart=i===0, isEnd=i===r.path.length-1;
                  return (
                    <div key={i} style={{position:'relative', marginBottom:i<r.path.length-1?18:0}}>
                      {/* Node */}
                      <div style={{position:'absolute', left:-13, top:1,
                        width:14, height:14, borderRadius:7,
                        background: isStart?'#3ddc84':isEnd?'#ff5252':'#0a0a14',
                        border:`2px solid ${isStart||isEnd?'#fff':c}`,
                        boxShadow:`0 0 0 3px #0a0a14`,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:7, fontWeight:700, color: isStart||isEnd?'#000':c,
                      }}>{isStart?'A':isEnd?'B':i}</div>

                      <div style={{paddingLeft:8}}>
                        <div style={{fontSize:11, fontWeight:600, color:'#fff', lineHeight:1.2}}>
                          {SC[step.sc].name}
                        </div>
                        {i<r.path.length-1 && (
                          <div style={{display:'flex', alignItems:'center', gap:5,
                            fontSize:9, color:'rgba(255,255,255,0.45)', marginTop:4}}>
                            <span style={{color:c, fontSize:11}}>{VIA_GLYPH[r.path[i+1].via]}</span>
                            <span>via {VIA_LABEL[r.path[i+1].via]}</span>
                            <span style={{color:'rgba(255,255,255,0.2)'}}>·</span>
                            <span>~{20+Math.floor(Math.random()*40)}s</span>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Footer */}
              <button style={{marginTop:10, padding:'7px 0', fontSize:10, fontFamily:'inherit',
                background: isBest ? c+'18' : 'transparent',
                color: isBest ? c : 'rgba(255,255,255,0.55)',
                border:`1px solid ${isBest?c+'55':'rgba(255,255,255,0.12)'}`,
                borderRadius:3, letterSpacing:0.5, cursor:'pointer'}}>
                {isBest ? 'CHOISIR CETTE ROUTE' : 'Sélectionner'}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// DESIGN 3 — GPS HUD overlay (map-centric, 3 routes simultanées)
// ═════════════════════════════════════════════════════════════════════════════
function Design3() {
  const AW=1180, AH=620;
  const S=0.85, W=1000*S, H=597*S;
  const ox=(AW-W)/2, oy=14;

  const [focus, setFocus] = React.useState('r1'); // hovered/selected route
  const ptOf = id => ({ x: SC[id].x*S+ox, y: SC[id].y*S+oy });

  return (
    <div style={{width:AW, height:AH, background:'#0a0a14', color:'#fff',
      overflow:'hidden', position:'relative'}}>

      {/* Map */}
      <img src="map_hyrule.png" draggable={false}
        style={{position:'absolute', left:ox, top:oy, width:W, height:H,
          userSelect:'none', filter:'brightness(0.55) saturate(0.85)'}}/>

      {/* Routes overlay */}
      <svg style={{position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none'}}>
        <defs>
          {ROUTES.map(r => (
            <marker key={r.id} id={`arr-${r.id}`} viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill={`oklch(0.75 0.16 ${r.hue})`}/>
            </marker>
          ))}
        </defs>

        {/* Draw all 3 routes, focused one on top */}
        {ROUTES.slice().sort(a=>a.id===focus?1:-1).map(r => {
          const isFocus = r.id===focus;
          const c = `oklch(0.75 0.16 ${r.hue})`;
          // Offset perpendicular per route for parallel lines
          const offsetIdx = ROUTES.findIndex(x=>x.id===r.id) - 1; // -1, 0, 1
          return (
            <g key={r.id} opacity={isFocus?1:0.32} style={{transition:'opacity 0.15s'}}>
              {r.path.map((step, i) => {
                if (i===0) return null;
                const a = ptOf(r.path[i-1].sc);
                const b = ptOf(step.sc);
                const dx=b.x-a.x, dy=b.y-a.y;
                const len=Math.sqrt(dx*dx+dy*dy)||1;
                const nx=-dy/len, ny=dx/len;
                const off = offsetIdx*6;
                const mx=(a.x+b.x)/2 + nx*(20+off);
                const my=(a.y+b.y)/2 + ny*(20+off);
                return (
                  <path key={i}
                    d={`M ${a.x} ${a.y} Q ${mx} ${my}, ${b.x} ${b.y}`}
                    fill="none" stroke={c}
                    strokeWidth={isFocus?3:2}
                    strokeLinecap="round"
                    strokeDasharray={step.via==='owl'?'5,4':step.via==='song'?'2,3':'none'}
                    markerEnd={isFocus?`url(#arr-${r.id})`:undefined}/>
                );
              })}
            </g>
          );
        })}

        {/* A & B markers (shared endpoints) */}
        {[['kak','A','#3ddc84'],['lake','B','#ff5252']].map(([id, lbl, col]) => {
          const p = ptOf(id);
          return (
            <g key={lbl}>
              <circle cx={p.x} cy={p.y} r={12} fill={col} stroke="#fff" strokeWidth={2}/>
              <text x={p.x} y={p.y+4} fontSize={12} textAnchor="middle"
                fontFamily="monospace" fontWeight={700} fill="#000">{lbl}</text>
            </g>
          );
        })}

        {/* Intermediate scenes for focused route */}
        {(() => {
          const r = ROUTES.find(x=>x.id===focus);
          const c = `oklch(0.75 0.16 ${r.hue})`;
          return r.path.slice(1,-1).map((step, i) => {
            const p = ptOf(step.sc);
            return (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r={5} fill="#0a0a14" stroke={c} strokeWidth={2}/>
                <text x={p.x+10} y={p.y+3} fontSize={10} fill="#fff"
                  fontFamily="monospace" style={{paintOrder:'stroke'}}
                  stroke="#0a0a14" strokeWidth={3}>{SC[step.sc].name}</text>
              </g>
            );
          });
        })()}
      </svg>

      {/* Top-left: From/To floating */}
      <div style={{position:'absolute', top:14, left:14, width:280,
        background:'rgba(6,6,18,0.92)', backdropFilter:'blur(8px)',
        border:'1px solid rgba(255,255,255,0.1)', borderRadius:5,
        padding:'10px 12px', boxShadow:'0 8px 28px rgba(0,0,0,0.5)'}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:8}}>
          <span style={{fontSize:10, color:'#3ddc84', letterSpacing:1.5}}>◆ GPS</span>
          <span style={{fontSize:9, color:'rgba(255,255,255,0.35)'}}>tracking actif</span>
          <span style={{marginLeft:'auto', width:6, height:6, borderRadius:3,
            background:'#3ddc84', boxShadow:'0 0 6px #3ddc84'}}/>
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:4, position:'relative'}}>
          <div style={{display:'flex', alignItems:'center', gap:8,
            padding:'5px 8px', background:'rgba(255,255,255,0.04)', borderRadius:3,
            borderLeft:'3px solid #3ddc84'}}>
            <span style={{fontSize:7, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>DE</span>
            <span style={{fontSize:11, fontWeight:500, flex:1}}>Kakariko</span>
            <span style={{fontSize:8, color:'rgba(255,255,255,0.3)'}}>▾</span>
          </div>
          <div style={{display:'flex', alignItems:'center', gap:8,
            padding:'5px 8px', background:'rgba(255,255,255,0.04)', borderRadius:3,
            borderLeft:'3px solid #ff5252'}}>
            <span style={{fontSize:7, color:'rgba(255,255,255,0.4)', letterSpacing:1}}>À&nbsp;&nbsp;</span>
            <span style={{fontSize:11, fontWeight:500, flex:1}}>Lake Hylia</span>
            <span style={{fontSize:8, color:'rgba(255,255,255,0.3)'}}>▾</span>
          </div>
        </div>
      </div>

      {/* Top-right: legend */}
      <div style={{position:'absolute', top:14, right:14,
        background:'rgba(6,6,18,0.85)', border:'1px solid rgba(255,255,255,0.08)',
        borderRadius:4, padding:'8px 10px'}}>
        <div style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:1.5, marginBottom:6}}>
          LÉGENDE
        </div>
        {[['walk','— plein','Marche'],['owl','– – tirets','Owl warp'],['song','· · pointillé','Chanson']].map(([k,vis,lbl])=>(
          <div key={k} style={{display:'flex', alignItems:'center', gap:8, fontSize:9,
            color:'rgba(255,255,255,0.55)', marginBottom:2}}>
            <span style={{width:32, color:'#fff'}}>{vis}</span>
            <span>{lbl}</span>
          </div>
        ))}
      </div>

      {/* Bottom: Route tabs + focused detail */}
      <div style={{position:'absolute', left:14, right:14, bottom:14,
        background:'rgba(6,6,18,0.92)', backdropFilter:'blur(8px)',
        border:'1px solid rgba(255,255,255,0.1)', borderRadius:5,
        boxShadow:'0 -8px 28px rgba(0,0,0,0.5)', overflow:'hidden'}}>

        {/* Tabs row */}
        <div style={{display:'flex', borderBottom:'1px solid rgba(255,255,255,0.08)'}}>
          {ROUTES.map(r => {
            const c = `oklch(0.75 0.16 ${r.hue})`;
            const active = r.id===focus;
            return (
              <div key={r.id} onMouseEnter={()=>setFocus(r.id)}
                style={{flex:1, padding:'10px 14px', cursor:'pointer',
                  borderBottom: active?`2px solid ${c}`:'2px solid transparent',
                  borderRight:'1px solid rgba(255,255,255,0.06)',
                  background: active?'rgba(255,255,255,0.025)':'transparent',
                  display:'flex', alignItems:'center', gap:10}}>
                <span style={{width:10, height:10, borderRadius:5, background:c,
                  boxShadow:active?`0 0 8px ${c}`:'none'}}/>
                <div style={{flex:1}}>
                  <div style={{display:'flex', alignItems:'baseline', gap:8}}>
                    <span style={{fontSize:14, fontWeight:700,
                      color:active?'#fff':'rgba(255,255,255,0.6)'}}>{r.time}</span>
                    <span style={{fontSize:10, color:c, fontWeight:500}}>{r.label}</span>
                  </div>
                  <div style={{fontSize:9, color:'rgba(255,255,255,0.4)', marginTop:1}}>
                    {r.steps} étapes · {r.transitions} transitions
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Focused step list */}
        <div style={{padding:'10px 14px'}}>
          {(() => {
            const r = ROUTES.find(x=>x.id===focus);
            const c = `oklch(0.75 0.16 ${r.hue})`;
            return (
              <div style={{display:'flex', alignItems:'center', gap:2, flexWrap:'wrap'}}>
                {r.path.map((step, i) => (
                  <React.Fragment key={i}>
                    <div style={{display:'flex', alignItems:'center', gap:6,
                      padding:'4px 8px',
                      background: i===0||i===r.path.length-1
                        ? (i===0?'rgba(61,220,132,0.12)':'rgba(255,82,82,0.12)')
                        : 'rgba(255,255,255,0.04)',
                      border:`1px solid ${i===0?'#3ddc84':i===r.path.length-1?'#ff5252':'rgba(255,255,255,0.08)'}55`,
                      borderRadius:3,
                    }}>
                      <span style={{fontSize:9, fontWeight:700,
                        color: i===0?'#3ddc84':i===r.path.length-1?'#ff5252':c}}>
                        {i===0?'A':i===r.path.length-1?'B':i}
                      </span>
                      <span style={{fontSize:10, fontWeight:500, color:'#fff'}}>{SC[step.sc].name}</span>
                    </div>
                    {i<r.path.length-1 && (
                      <div style={{display:'flex', alignItems:'center', gap:3, padding:'0 6px'}}>
                        <span style={{fontSize:11, color:c}}>{VIA_GLYPH[r.path[i+1].via]}</span>
                        <span style={{fontSize:8, color:'rgba(255,255,255,0.4)', letterSpacing:0.5}}>
                          {VIA_LABEL[r.path[i+1].via].toUpperCase()}
                        </span>
                      </div>
                    )}
                  </React.Fragment>
                ))}
                <button style={{marginLeft:'auto', padding:'5px 14px', fontSize:10,
                  fontFamily:'inherit', background:c+'18', color:c,
                  border:`1px solid ${c}55`, borderRadius:3, cursor:'pointer',
                  letterSpacing:0.5}}>SUIVRE ▸</button>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection id="gps" title="Sélecteur de route GPS"
        subtitle="3 directions pour choisir une scène de départ et d'arrivée, puis comparer les chemins du plus rapide au plus lent">
        <DCArtboard id="d1" label="① Directions sidebar (Google Maps)" width={1180} height={620}>
          <Design1/>
        </DCArtboard>
        <DCArtboard id="d2" label="② Transit diagram (colonnes côte à côte)" width={1180} height={620}>
          <Design2/>
        </DCArtboard>
        <DCArtboard id="d3" label="③ HUD overlay (3 routes simultanées sur la map)" width={1180} height={620}>
          <Design3/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
