// ─────────────────────────────────────────────────────
// ITEM ICON CELL
// ─────────────────────────────────────────────────────
function ItemCell({ icon, color, label, found, count, onClick, selected }) {
  const dim = !found;
  return (
    <div onClick={onClick} style={{
      width: 70, display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
      cursor: "pointer", padding: "6px 4px", borderRadius: 8,
      background: selected ? `${color}20` : "transparent",
      border: `1px solid ${selected ? color : "transparent"}`,
      transition: "all 0.15s",
      position: "relative",
    }}>
      <div style={{
        width: 44, height: 44,
        filter: dim ? "grayscale(1)" : "none",
        opacity: dim ? 0.25 : 1,
        transition: "all 0.3s",
        position: "relative",
      }}>
        {icon(found ? color : "#888")}
        {found && <div style={{ position: "absolute", inset: 0, borderRadius: 8, boxShadow: `0 0 12px ${color}66`, pointerEvents: "none" }}/>}
      </div>
      {count !== undefined && found && (
        <div style={{
          position: "absolute", bottom: 22, right: 6,
          background: color, color: "#080f1a",
          fontSize: 9, fontWeight: 700, borderRadius: 8, padding: "1px 4px",
          minWidth: 16, textAlign: "center", fontFamily: T.mono,
          boxShadow: `0 0 4px ${color}88`,
        }}>{count}</div>
      )}
      <span style={{
        fontSize: 9, color: found ? T.text : T.textDim, textAlign: "center",
        lineHeight: 1.2, width: "100%", fontFamily: T.font,
        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
      }}>{label}</span>
    </div>
  );
}

// ─────────────────────────────────────────────────────
// SECTION HEADER
// ─────────────────────────────────────────────────────
function SectionHeader({ title, found, total, color }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "6px 12px", background: `${color}12`,
      borderTop: `1px solid ${color}30`, borderBottom: `1px solid ${color}30`,
      marginBottom: 2,
    }}>
      <span style={{ fontSize: 10, fontWeight: 600, color, letterSpacing: "0.08em", textTransform: "uppercase" }}>{title}</span>
      <span style={{ fontSize: 10, fontFamily: T.mono, color: found === total ? color : T.textDim }}>
        {found}<span style={{ color: T.textDim }}>/{total}</span>
      </span>
    </div>
  );
}

// ─────────────────────────────────────────────────────
// APP CHROME (shared tab bar + menu)
// ─────────────────────────────────────────────────────
function AppChrome({ activeTab, onTabChange, gameTab }) {
  const tabAccent = (id) => id === "OoT" ? T.accent : id === "MM" ? T.accentMM : T.gold;
  return (
    <div style={{ flexShrink: 0 }}>
      <div style={{ height: 26, background: T.panel, borderBottom: `1px solid ${T.border}`, display: "flex", alignItems: "center", padding: "0 12px", gap: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <div style={{ width: 7, height: 7, borderRadius: "50%", background: gameTab === "OoT" ? T.accent : T.accentMM, boxShadow: `0 0 6px ${gameTab === "OoT" ? T.accent : T.accentMM}` }}/>
          <span style={{ color: gameTab === "OoT" ? T.accent : T.accentMM, fontSize: 11, fontWeight: 600, letterSpacing: "0.05em" }}>OoTMM COMBO</span>
        </div>
        {["Tracking", "Options", "?"].map(m => <span key={m} style={{ color: T.textDim, fontSize: 11, cursor: "pointer" }}>{m}</span>)}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
          <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#4a8a4a" }}/>
          <span style={{ color: T.textDim, fontSize: 10 }}>Tracking actif</span>
        </div>
      </div>
      <div style={{ height: 44, background: T.panel, borderBottom: `1px solid ${T.border}`, display: "flex", alignItems: "stretch" }}>
        {[
          { id: "Launch", label: "Launch" },
          { id: "OoT", label: "OoT", count: "47/183", pct: 26, color: T.accent },
          { id: "MM", label: "MM", count: "32/156", pct: 21, color: T.accentMM },
          { id: "Prog", label: "Progression", color: T.gold },
          { id: "Entrances", label: "Entrances" },
          { id: "Settings", label: "⚙ Settings" },
        ].map(t => (
          <div key={t.id} onClick={() => onTabChange && onTabChange(t.id)} style={{
            padding: "0 18px", display: "flex", alignItems: "center", gap: 8, cursor: "pointer",
            borderRight: `1px solid ${T.border}`,
            borderBottom: activeTab === t.id ? `3px solid ${t.color || T.textDim}` : "3px solid transparent",
            background: activeTab === t.id ? `${(t.color || T.textDim)}18` : "transparent",
            color: activeTab === t.id ? (t.color || T.text) : T.textDim, fontSize: 12, fontWeight: activeTab === t.id ? 600 : 400,
          }}>
            {t.label}
            {t.count && <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              <span style={{ fontSize: 9, color: activeTab === t.id ? t.color : "#333" }}>{t.count}</span>
              <div style={{ width: 48, height: 3, background: "#1a1a2a", borderRadius: 2 }}>
                <div style={{ width: `${t.pct}%`, height: "100%", background: t.color, borderRadius: 2 }}/>
              </div>
            </div>}
          </div>
        ))}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", padding: "0 18px", gap: 10 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 9, color: T.textDim }}>Total</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: T.text }}>79<span style={{ color: T.textDim, fontSize: 11, fontWeight: 400 }}>/339</span></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ToggleSwitch({ value, accent }) {
  const c = accent || T.accent;
  return (
    <div style={{ width: 36, height: 20, background: value ? c : "#1a2535", borderRadius: 10, position: "relative", border: `1px solid ${value ? c : T.border}`, flexShrink: 0, cursor: "pointer", transition: "all 0.2s" }}>
      <div style={{ position: "absolute", top: 2, left: value ? 17 : 2, width: 14, height: 14, borderRadius: 7, background: value ? "#fff" : "#4a6a9a", transition: "left 0.2s", boxShadow: value ? `0 0 4px ${c}88` : "none" }}/>
    </div>
  );
}

function ShuffleDropdown({ value, accent }) {
  const c = accent || T.accent;
  const labels = { vanilla: "Vanilla", dungeons: "Donjons", overworld: "Monde", all: "Partout" };
  const colors = { vanilla: T.textDim, dungeons: "#e0a040", overworld: "#40c060", all: c };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4, background: T.bg, border: `1px solid ${value !== "vanilla" ? c + "66" : T.border}`, borderRadius: 6, padding: "3px 8px", minWidth: 86, cursor: "pointer" }}>
      <div style={{ width: 6, height: 6, borderRadius: "50%", background: colors[value] || T.textDim, flexShrink: 0 }}/>
      <span style={{ fontSize: 10, color: colors[value] || T.textDim, flex: 1 }}>{labels[value] || value}</span>
      <span style={{ fontSize: 8, color: T.textDim }}>▼</span>
    </div>
  );
}

function GameBadge({ game }) {
  if (!game) return null;
  const c = game === "OoT" ? T.accent : T.accentMM;
  return <span style={{ fontSize: 8, fontWeight: 700, color: c, background: `${c}20`, border: `1px solid ${c}44`, borderRadius: 3, padding: "1px 4px", flexShrink: 0 }}>{game}</span>;
}

                <div>
                  <div style={{ fontSize: 9, color: T.textDim, marginBottom: 6, letterSpacing: "0.08em", textTransform: "uppercase" }}>Trouvé dans</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: T.bg, borderRadius: 6, border: `1px solid ${T.border}` }}>
                    <div style={{ width: 6, height: 6, borderRadius: "50%", background: accent, flexShrink: 0 }}/>
                    <div>
                      <div style={{ fontSize: 12, color: T.text }}>{detail.foundAt || "—"}</div>
                      <div style={{ fontSize: 10, color: T.textDim }}>{detail.foundObj || "—"}</div>
                    </div>
                  </div>
                </div>
                {/* Counter if any */}
                {detail.count !== undefined && (
                  <div>
                    <div style={{ fontSize: 9, color: T.textDim, marginBottom: 6, letterSpacing: "0.08em", textTransform: "uppercase" }}>Quantité</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ fontSize: 28, fontWeight: 700, color: detail.color || accent, fontFamily: T.mono }}>{detail.count}</div>
                    </div>
                  </div>
                )}
              </>}
            </div>
          ) : (
            <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, opacity: 0.3, padding: 20, textAlign: "center" }}>
              <div style={{ width: 48, height: 48, opacity: 0.4 }}>
                {SVGIcons.magic(T.textDim)}
              </div>
              <div style={{ fontSize: 11, color: T.textDim }}>Sélectionner un item pour voir ses détails</div>
            </div>
          )}

          {/* Stats bottom */}
          <div style={{ borderTop: `1px solid ${T.border}`, padding: "10px 14px", flexShrink: 0 }}>
            <div style={{ fontSize: 9, color: T.textDim, marginBottom: 6, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              {game === "Souls" ? "Souls" : game}
            </div>
            {game === "OoT" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                {[
                  { label: "Armes", found: OOT_WEAPONS.filter(i=>i.found).length, total: OOT_WEAPONS.length, color: T.accent },
                  { label: "Équipement", found: OOT_EQUIPMENT.filter(i=>i.found).length, total: OOT_EQUIPMENT.length, color: T.accent },
                  { label: "Quête", found: OOT_QUEST.filter(i=>i.found).length, total: OOT_QUEST.length, color: T.gold },
                  { label: "Chansons", found: OOT_SONGS.filter(i=>i.found).length, total: OOT_SONGS.length, color: "#c060e0" },
                ].map(s => (
                  <div key={s.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 10, color: T.textDim, width: 70 }}>{s.label}</span>
                    <div style={{ flex: 1, height: 3, background: "#111", borderRadius: 2 }}>
                      <div style={{ width: `${(s.found/s.total)*100}%`, height: "100%", background: s.color, borderRadius: 2 }}/>
                    </div>
                    <span style={{ fontSize: 9, color: s.color, fontFamily: T.mono, width: 30, textAlign: "right" }}>{s.found}/{s.total}</span>
                  </div>
                ))}
              </div>
            )}
            {game === "MM" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                {[
                  { label: "Transf.", found: MM_MASKS_TRANSFORM.filter(i=>i.found).length, total: 4, color: T.accentMM },
                  { label: "Masques", found: MM_MASKS_OTHER.filter(i=>i.found).length, total: MM_MASKS_OTHER.length, color: T.accentMM },
                  { label: "Boss", found: MM_QUEST.filter(i=>i.found).length, total: 4, color: T.gold },
                  { label: "Chansons", found: MM_SONGS.filter(i=>i.found).length, total: MM_SONGS.length, color: "#c060e0" },
                ].map(s => (
                  <div key={s.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 10, color: T.textDim, width: 70 }}>{s.label}</span>
                    <div style={{ flex: 1, height: 3, background: "#111", borderRadius: 2 }}>
                      <div style={{ width: `${(s.found/s.total)*100}%`, height: "100%", background: s.color, borderRadius: 2 }}/>
                    </div>
                    <span style={{ fontSize: 9, color: s.color, fontFamily: T.mono, width: 30, textAlign: "right" }}>{s.found}/{s.total}</span>
                  </div>
                ))}
              </div>
            )}
            {game === "Souls" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                {SOULS_GROUPS.map(g => (
                  <div key={g.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 9, color: T.textDim, width: 80, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.label.split("—")[0].trim()}</span>
                    <div style={{ flex: 1, height: 3, background: "#111", borderRadius: 2 }}>
                      <div style={{ width: `${(g.items.filter(s=>s.found).length/g.items.length)*100}%`, height: "100%", background: g.color, borderRadius: 2 }}/>
                    </div>
                    <span style={{ fontSize: 9, color: g.color, fontFamily: T.mono, width: 28, textAlign: "right" }}>{g.items.filter(s=>s.found).length}/{g.items.length}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas title="OoTMMCombo — Settings & Progression">
      <DCSection id="s1" title="⚙ Settings">
        <DCArtboard id="a1" label="Settings — Section Clés & Donjons" width={1280} height={720}>
          <SettingsScreen />
        </DCArtboard>
      </DCSection>
      <DCSection id="s2" title="📊 Onglet Progression">
        <DCArtboard id="a2" label="Progression — OoT (Armes, Équipement, Médaillons…)" width={1280} height={720}>
          <ProgressionTab defaultGame="OoT" />
        </DCArtboard>
        <DCArtboard id="a3" label="Progression — MM (Masques, Restes, Fées…)" width={1280} height={720}>
          <ProgressionTab defaultGame="MM" />
        </DCArtboard>
        <DCArtboard id="a4" label="Progression — Souls (liste compacte par groupe)" width={1280} height={720}>
          <ProgressionTab defaultGame="Souls" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<div id="root"></div>
</body>
