[package]
name = "rust-tracker"
version = "0.1.0"
edition = "2021"
description = "Spike : réécriture Rust + egui du tracker OoTMM (tranche verticale)"

[dependencies]
toml = "0.9"
serde = { version = "1", features = ["derive"] }
# GUI : egui (immediate-mode) + eframe (fenêtre + boucle de rendu, backend natif).
eframe = { version = "0.29", default-features = true }
# Décodage des JPG/PNG de maps et d'icônes en textures.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# La mémoire partagée Win32 est appelée via des extern "system" bruts dans
# shared_mem.rs (kernel32) : zéro dépendance, layout garanti stable sans
# dépendre d'une version de crate windows-sys. Voir src/shared_mem.rs.

[profile.release]
opt-level = 3
lto = true
